<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>新游资讯雷达</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#top" aria-label="新游资讯雷达首页">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span><strong>新游资讯雷达</strong><small>全球未上市手游情报</small></span>
      </a>
      <nav class="main-nav" aria-label="页面导航"><a class="active" href="#feed">资讯</a><a href="#interestPanel">关注</a></nav>
      <div class="header-tools">
        <span id="generatedAt" class="sync-state">等待采集</span>
        <details class="source-disclosure">
          <summary>来源</summary>
          <div id="sourceList" class="source-list"></div>
        </details>
      </div>
    </header>

    <main id="top">
      <section class="overview-band" aria-labelledby="overviewTitle">
        <div class="overview-copy">
          <p>NEW RELEASE INTELLIGENCE</p>
          <h1 id="overviewTitle">未上市手游，按重要度整理</h1>
          <span>近 7 天资讯统一中文呈现，地区服差异也纳入追踪。</span>
        </div>
        <dl class="overview-stats">
          <div><dt>近 7 天</dt><dd id="itemCount">0</dd></div>
          <div><dt>已知档期</dt><dd id="datedCount">0</dd></div>
          <div><dt>持续关注</dt><dd id="interestCount">0</dd></div>
          <div><dt>来源覆盖</dt><dd id="sourceCount">0</dd></div>
        </dl>
      </section>

      <section id="focusSection" class="focus-section hidden" aria-labelledby="focusTitle">
        <div class="section-heading">
          <div><span>RADAR PICKS</span><h2 id="focusTitle">本期重点</h2></div>
          <p>按信号强度与发布时间筛选</p>
        </div>
        <div id="focusRail" class="focus-rail"></div>
      </section>

      <section id="feed" class="feed-shell" aria-labelledby="feedTitle">
        <div class="filter-bar" aria-label="资讯筛选">
          <label class="search-field"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" aria-label="搜索资讯" placeholder="搜索游戏、地区或关键词"></label>
          <div class="segmented status-filter" role="group" aria-label="状态筛选">
            <button class="active" type="button" data-status="all">全部</button>
            <button type="button" data-status="unreleased candidate">未上市</button>
            <button type="button" data-status="region-gap candidate">地区差</button>
            <button type="button" data-status="low-score review">待复核</button>
          </div>
          <label class="select-field"><span>来源</span><select id="sourceSelect" aria-label="来源筛选"><option value="all">全部来源</option></select></label>
          <label class="select-field"><span>地区</span><select id="regionSelect" aria-label="地区筛选">
            <option value="all">全部地区</option><option value="global">全球</option><option value="kr">韩国</option><option value="jp">日本</option><option value="cn">中国大陆</option><option value="sea">东南亚</option><option value="tw-hk-mo">港澳台</option>
          </select></label>
          <div class="view-switch" role="group" aria-label="显示方式">
            <button class="active" type="button" data-view="cards" title="卡片视图" aria-label="卡片视图">▦</button>
            <button type="button" data-view="list" title="列表视图" aria-label="列表视图">☷</button>
          </div>
          <a id="manualCollectLink" class="manual-action" target="_blank" rel="noreferrer">立即采集</a>
        </div>

        <section id="interestPanel" class="interest-panel hidden" aria-live="polite">
          <div class="section-heading compact">
            <div><span>WATCHLIST</span><h2>持续关注</h2></div>
            <button id="clearInterestButton" class="text-button" type="button">清空关注</button>
          </div>
          <div id="interestList" class="interest-list"></div>
        </section>

        <div class="feed-heading">
          <div><span>NEWS FEED</span><h2 id="feedTitle">最新资讯 <small id="resultCount">0 条</small></h2></div>
          <label class="sort-control"><span>排序</span><select id="sortSelect"><option value="latest">最新发布</option><option value="score">信号优先</option><option value="release">发售临近</option></select></label>
        </div>

        <section id="newsList" class="news-list" data-view="cards" aria-live="polite"></section>
        <section id="emptyState" class="empty hidden"><h2>没有符合条件的资讯</h2><p>调整筛选条件，或使用右上方的立即采集。</p></section>
      </section>
    </main>

    <template id="newsTemplate">
      <article class="news-card">
        <a class="news-media" target="_blank" rel="noreferrer"><img loading="lazy" decoding="async"><span class="media-fallback" aria-hidden="true"></span><span class="media-source"></span></a>
        <div class="news-content">
          <div class="news-meta"><span class="source"></span><time></time><span class="status"></span><span class="score"></span></div>
          <h3><a class="news-title" target="_blank" rel="noreferrer"></a></h3>
          <p class="original-title hidden"></p>
          <p class="summary-text"></p>
          <div class="game-row"><div><span class="game-label">GAME</span><strong class="game-name"></strong></div><button class="interest-button" type="button">＋ 关注</button></div>
          <div class="game-details"><span class="game-release"></span><span class="game-servers"></span><span class="official-links"><span class="game-official"></span><span class="game-x"></span></span></div>
          <div class="chips"></div>
        </div>
      </article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
